name: road_assist
description: A high-fidelity roadside assistance prototype.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  latlong2: ^0.10.1

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0

  url_launcher: ^6.3.2

  image_picker: ^1.2.3
  image: ^4.9.2
  camera: ^0.12.0+2

  geocoding: ^5.0.0
  http: ^1.6.0
  web: ^1.1.1

  shared_preferences: ^2.5.5
  speech_to_text: ^7.3.0
  connectivity_plus: ^7.0.0

  # Premium typography
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# firebase_core_web 3.11.0 currently fails to compile on Chrome because its
# JS error guard calls isA on Object. Keep the last compatible web release
# until the upstream package publishes a fix.
dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true

  # Keep Manrope for compatibility with existing screens.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0C285F"
  adaptive_icon_foreground: assets/images/app_icon.png
  min_sdk_android: 21