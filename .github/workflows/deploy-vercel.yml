name: Deploy Flutter web to Vercel

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web app
        run: |
          flutter pub get
          flutter build web --release

      - name: Assemble Vercel deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment_dir="$RUNNER_TEMP/roadassist-vercel"
          mkdir -p "$deployment_dir/api" "$deployment_dir/.vercel"
          cp -R build/web/. "$deployment_dir/"
          cp -R api/. "$deployment_dir/api/"
          cp package.json vercel.json "$deployment_dir/"
          printf '{"orgId":"%s","projectId":"%s"}' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" \
            > "$deployment_dir/.vercel/project.json"

      - name: Deploy to Vercel production
        working-directory: ${{ runner.temp }}/roadassist-vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN"
