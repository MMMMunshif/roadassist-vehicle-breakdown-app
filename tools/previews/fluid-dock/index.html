const brandHeader=()=>`<div class="top"><img class="logo" src="${asset}roadassist_mark.png" alt="RoadAssist"><span class="wordmark">Road<b>Assist</b></span><button class="round" aria-label="Notifications" onclick="notice(this,'Sample notifications preview.')">${icon('bell')}</button></div>`;
const nav=provider=>`<nav class="nav" aria-label="${provider?'Provider':'Driver'} navigation">${(provider?[['grid','Dashboard'],['list','Requests'],['car','Jobs'],['chat','Messages'],['user','Profile']]:[['home','Home'],['list','Requests'],['chat','Messages'],['user','Profile']]).map(([i,t],n)=>`<button class="${n===0?'active':''}" onclick="selectTab(this)">${icon(i)}<span class="tab-label">${t}</span></button>`).join('')}</nav>`;
const driver=`<div class="content">${brandHeader()}<p class="greeting">Good morning, Affan</p><h2>Go further.<br>We've got you.</h2><div class="location">${icon('pin')}Colombo, Sri Lanka</div><section class="help soft"><div class="orb"></div><div class="journey"><span class="route-line"></span><img src="../../../assets/images/auth_journey_car.png" alt="" class="moving-car"><span class="destination">+</span></div><span class="smallcap">ROADSIDE ASSISTANCE</span><h3>Your road.<br>Our reassurance.</h3><p>Find a suitable provider and review your visit fee before requesting help.</p><button class="primary" onclick="notice(this,'Request assistance · preview only. No request sent.')">Request assistance ${icon('arrow')}</button></section><div class="section-title"><h3>Your vehicle</h3><span>Default vehicle</span></div><section class="vehicle soft"><div><span class="smallcap">READY FOR YOUR NEXT TRIP</span><h4>Toyota Aqua</h4><p>CAB–3223 · Hybrid</p></div><img class="car" src="${asset}auth_journey_car.png" alt="Illustrative silver car"><span>${icon('arrow')}</span></section><div class="section-title"><h3>What do you need?</h3><span>Explore services</span></div><div class="services">${[['tool','Mechanic'],['tyre','Flat tyre'],['battery','Jumpstart']].map(([i,t])=>`<button class="service" onclick="notice(this,'${t} selected · sample interaction')"><span class="service-icon">${icon(i)}</span>${t}</button>`).join('')}</div><div class="section-title"><h3>Last assistance</h3><span>Your history</span></div><div class="recent soft"><span class="icon-well inset">${icon('check')}</span><div><strong>General mechanic</strong><p>Completed · 22 Oct</p></div><span>View receipt</span></div></div>${nav(false)}`;
const provider=`<div class="content">${brandHeader()}<p class="greeting">Good morning, Munshif</p><h2>Ready to help.<br>Ready to earn.</h2><div class="location">${icon('pin')}20 km service coverage</div><section class="availability soft"><span class="icon-well inset">${icon('power')}</span><div><strong id="availability-title">Accepting requests</strong><p id="availability-copy">You're visible to nearby drivers</p></div><button class="switch inset" role="switch" aria-checked="true" aria-label="Sample availability" onclick="availability(this)"></button></section><div class="metrics"><section class="metric soft">${icon('wallet')}<span class="smallcap" style="display:block;margin-bottom:7px">THIS WEEK</span><strong><small>LKR</small> 12,400</strong><p>Completed service revenue</p></section><section class="metric soft">${icon('star')}<span class="smallcap" style="display:block;margin-bottom:7px">YOUR RATING</span><strong class="rating">4.9 ${icon('star')}</strong><p>From 28 driver reviews</p></section></div><div class="section-title"><h3>Nearby requests</h3><span id="request-count">1 suitable request</span></div><section class="job soft" id="sample-job"><div class="job-head"><span class="avatar inset">NP</span><div><strong>Nimal Perera</strong><p>Toyota Aqua · CAB–1234</p></div><span class="tag">Normal</span></div><h4>Flat tyre assistance</h4><p class="meta">Galle Road · 2.4 km away</p><div class="fee inset"><span>Estimated visit fee</span><strong>LKR 140</strong></div><button class="primary" onclick="notice(this,'Request details · preview only. No job accepted.')">View request ${icon('arrow')}</button></section><div class="provider-footer">${icon('check')}Verified provider · Ready to help</div></div>${nav(true)}`;
document.querySelector('.board').innerHTML=[['DRIVER DASHBOARD',driver],['PROVIDER DASHBOARD',provider]].map(([label,body])=>`<div><p class="label">${label}</p><article class="phone">${road()}${body}<div class="toast" role="status"></div></article></div>`).join('');
function selectTab(button){button.closest('nav').querySelectorAll('button').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-current','false')});button.classList.add('active');button.setAttribute('aria-current','page')}
function replay(){document.querySelectorAll('.content>*,.nav').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation='';})}
function notice(button,text){const t=button.closest('.phone').querySelector('.toast');t.textContent=text;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function availability(b){const online=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',online);document.querySelector('#availability-title').textContent=online?'Accepting requests':'Availability paused';document.querySelector('#availability-copy').textContent=online?"You're visible to nearby drivers":'Sample availability is switched off';document.querySelector('#sample-job').style.opacity=online?'1':'.4';document.querySelector('#request-count').textContent=online?'1 suitable request':'Paused · preview only'}
</script></html>
