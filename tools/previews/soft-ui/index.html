@font-face{font-family:Jakarta;src:url('../../../assets/fonts/PlusJakartaSans-Regular.ttf');font-weight:400}@font-face{font-family:Jakarta;src:url('../../../assets/fonts/PlusJakartaSans-Bold.ttf');font-weight:700}@font-face{font-family:Jakarta;src:url('../../../assets/fonts/PlusJakartaSans-ExtraBold.ttf');font-weight:800}*{box-sizing:border-box}body{margin:0;background:#dce6ee;color:#12364d;font:13px Jakarta,sans-serif;padding:28px}header{max-width:870px;margin:0 auto 25px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:23px;margin:0 0 7px;letter-spacing:-.7px}header p{margin:0;color:#5b768b;font-size:11px;line-height:1.6}.board{display:flex;justify-content:center;gap:34px}.label{font-size:10px;letter-spacing:2px;font-weight:800;margin:0 0 12px 8px}.phone{--surface:#eaf1f7;--shadow:#becfdf;--shine:#fff;--text:#16364c;--muted:#668094;--blue:#087ff0;--line:#cbdbe8;width:390px;height:844px;border-radius:35px;background:#f7fbff;color:var(--text);position:relative;isolation:isolate;overflow:hidden;border:1px solid #ffffffc4;box-shadow:15px 20px 45px #708da738,-12px -12px 35px #ffffff9c}.road{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}.content{padding:23px 23px 105px;height:100%;overflow:auto;scrollbar-width:none}.top{display:flex;align-items:center;gap:8px;margin-bottom:28px}.logo{width:30px;height:35px;object-fit:contain}.wordmark{font-size:21px;font-weight:800;letter-spacing:-.8px}.wordmark b{color:#159ae7}.top .round{margin-left:auto}.round{border:0;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:5px 5px 12px var(--shadow),-5px -5px 12px var(--shine);cursor:pointer}.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.greeting{font-size:12px;color:var(--muted);margin:0 0 6px}h2{font-size:29px;line-height:1.22;letter-spacing:-1.1px;margin:0;font-weight:800}.location{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:12px}.location .i{width:14px;height:14px;color:var(--blue)}.soft{background:var(--surface);border-radius:26px;box-shadow:9px 9px 20px var(--shadow),-9px -9px 20px var(--shine);border:1px solid #ffffff40}.inset{background:var(--surface);box-shadow:inset 4px 4px 9px var(--shadow),inset -4px -4px 9px var(--shine);border-radius:17px}.help{margin-top:25px;padding:21px;position:relative;overflow:hidden}.help .orb{position:absolute;right:-28px;top:-28px;width:142px;height:142px;border-radius:50%;box-shadow:inset 7px 7px 15px var(--shadow),inset -7px -7px 15px var(--shine);opacity:.65}.smallcap{font-size:8px;letter-spacing:1.8px;font-weight:800;color:var(--muted)}.help h3{position:relative;font-size:21px;letter-spacing:-.65px;line-height:1.3;max-width:240px;margin:10px 0 8px}.help p{position:relative;color:var(--muted);font-size:11px;line-height:1.7;margin:0 0 20px;max-width:220px}button{font:inherit}button:focus-visible{outline:3px solid #0786ef;outline-offset:4px}.primary{background:linear-gradient(135deg,#2a9cff,#0879df);box-shadow:5px 5px 12px #94b7d0,-5px -5px 12px #fff8,inset 0 1px #8bcfff;border:0;border-radius:16px;min-height:49px;width:100%;padding:13px 15px;color:white;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;position:relative;cursor:pointer;transition:transform .16s,box-shadow .16s}.primary:active{transform:scale(.975);box-shadow:inset 4px 4px 10px #0053a1,inset -3px -3px 8px #64baff}.section-title{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.section-title h3{font-size:14px;margin:0;font-weight:800;letter-spacing:-.3px}.section-title span{font-size:9px;color:var(--muted)}.vehicle{display:flex;align-items:center;padding:13px 13px 13px 17px;gap:12px;min-height:102px}.vehicle .car{width:118px;height:72px;object-fit:contain;filter:drop-shadow(0 8px 4px #12364d25)}.vehicle h4{font-size:12px;margin:6px 0}.vehicle p{font-size:10px;color:var(--muted);margin:0}.vehicle .i{margin-left:auto;width:15px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.service{display:flex;align-items:center;flex-direction:column;gap:10px;color:var(--text);font-size:9px;font-weight:700;border:0;background:none;padding:0;cursor:pointer}.service-icon{height:58px;width:65px;border-radius:20px;display:grid;place-items:center;background:var(--surface);box-shadow:6px 6px 13px var(--shadow),-6px -6px 13px var(--shine);transition:box-shadow .2s}.service-icon .i{width:26px;height:26px;color:var(--blue)}.service:active .service-icon{box-shadow:inset 4px 4px 8px var(--shadow),inset -4px -4px 8px var(--shine)}.recent{padding:14px 16px;display:flex;gap:11px;align-items:center}.recent .icon-well{padding:9px;color:#1b9b82}.recent strong{font-size:11px}.recent p{font-size:9px;color:var(--muted);margin:4px 0 0}.recent>span{font-size:9px;font-weight:700;margin-left:auto;white-space:nowrap}.nav{position:absolute;bottom:18px;left:17px;right:17px;background:var(--surface);border-radius:25px;padding:9px 6px;display:flex;justify-content:space-around;box-shadow:8px 8px 20px var(--shadow),-7px -7px 20px var(--shine);border:1px solid #ffffff40}.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:8px;color:var(--muted);padding:6px 9px;min-width:55px;cursor:pointer}.nav button.active{border-radius:17px;box-shadow:inset 4px 4px 8px var(--shadow),inset -4px -4px 8px var(--shine);color:var(--blue);font-weight:800}.availability{margin-top:24px;padding:18px;display:flex;align-items:center;gap:13px}.availability .icon-well{padding:12px;color:#159d86}.availability strong{font-size:12px}.availability p{font-size:9px;color:var(--muted);margin:5px 0 0}.switch{margin-left:auto;flex-shrink:0;width:49px;height:29px;position:relative;border:0;padding:4px;cursor:pointer}.switch:after{content:'';display:block;width:21px;height:21px;position:absolute;top:4px;left:4px;border-radius:50%;background:#8dabbf;box-shadow:2px 2px 5px #8faabc,-2px -2px 5px #fff;transition:transform .25s,background .25s}.switch[aria-checked=true]:after{background:#0789ef;transform:translateX(20px);box-shadow:2px 2px 5px #4b85ad,-2px -2px 5px #b3e4ff}.metrics{display:grid;grid-template-columns:1.2fr 1fr;gap:15px;margin-top:22px}.metric{padding:17px}.metric .i{color:var(--blue);width:19px;height:19px;margin-bottom:14px}.metric strong{display:block;font-size:24px;letter-spacing:-.8px;white-space:nowrap}.metric strong small{font-size:11px;letter-spacing:0}.metric p{color:var(--muted);font-size:9px;line-height:1.5;margin:5px 0 0}.metric .rating{display:flex;align-items:center;gap:6px}.rating .i{margin:0;width:15px;height:15px;color:#b57c20}.job{padding:18px}.job-head{display:flex;align-items:center;gap:10px}.avatar{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;color:var(--blue);font-size:11px;font-weight:800}.job-head strong{font-size:12px}.job-head p{font-size:9px;color:var(--muted);margin:4px 0 0}.tag{margin-left:auto;color:#087f69;font-size:8px;font-weight:800;background:#0daa8a12;border-radius:8px;padding:6px 8px}.job h4{font-size:15px;letter-spacing:-.4px;margin:17px 0 5px}.job .meta{font-size:10px;color:var(--muted);margin:0}.fee{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;margin:15px 0;font-size:10px;color:var(--muted)}.fee strong{font-size:12px;color:var(--text)}.provider-footer{margin-top:17px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:9px;color:var(--muted)}.provider-footer .i{width:13px;height:13px;color:#159c84}.mode{padding:11px 17px;border:1px solid #bbcfdf;background:#eff5fa;color:#21435b;border-radius:14px;font-size:11px;cursor:pointer}.footnote{text-align:center;font-size:10px;margin:24px auto 0;color:#627e93}.toast{position:absolute;left:25px;right:25px;bottom:108px;background:#12364dee;color:white;padding:14px;border-radius:16px;font-size:11px;line-height:1.6;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.dark .phone{--surface:#112b40;--shadow:#071522;--shine:#20475e;--text:#e2effa;--muted:#93b1c7;--line:#26475e;background:#041426;border-color:#28465e;box-shadow:15px 20px 40px #04142366}.dark{background:#0a1c2c;color:#e2effa}.dark header p,.dark .footnote{color:#91acc0}.dark .primary{box-shadow:5px 5px 12px #061824,-5px -5px 12px #244b60,inset 0 1px #8bcfff}.dark .tag{color:#73d6ba}.dark .phone .soft,.dark .nav{border-color:#31566b40}.dark .switch:after{box-shadow:2px 2px 5px #04101b,-2px -2px 5px #326080}.dark .mode{background:#112d43;border-color:#33546d;color:#c8e4fa}@media(max-width:850px){body{padding:20px 10px}.board{flex-wrap:wrap}header{max-width:390px}.phone{max-width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
 .job{padding:16px}.metrics{margin-top:18px}.job h4{margin-top:13px}.job .fee{margin:12px 0}.help{padding:19px}.help p{margin-bottom:16px}.vehicle{min-height:94px}</style><svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><symbol id="bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0v6l2 3H4l2-3zM10 21h4"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol><symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0z"/><circle cx="12" cy="10" r="2"/></symbol><symbol id="car" viewBox="0 0 24 24"><path d="M4 10l3-6h10l3 6v8H4zM4 10h16M7 14h1m8 0h1M6 18v2m12-2v2"/></symbol><symbol id="tool" viewBox="0 0 24 24"><path d="M14 4a6 6 0 0 0-7 7l-4 5a3 3 0 0 0 4 4l6-6a6 6 0 0 0 7-7l-4 3-3-3z"/></symbol><symbol id="battery" viewBox="0 0 24 24"><path d="M8 4V2h8v2M6 5h12v17H6zM13 8l-3 5h4l-3 5"/></symbol><symbol id="tyre" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="7" ry="10"/><ellipse cx="12" cy="12" rx="3" ry="6"/><path d="M6 7l3 2M6 15l3 2m6-10 3-2m-3 12 3-2"/></symbol><symbol id="home" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7M5 9v12h5v-7h4v7h5V9"/></symbol><symbol id="list" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/></symbol><symbol id="chat" viewBox="0 0 24 24"><path d="M3 4h18v13H9l-6 4zM7 9h10M7 13h6"/></symbol><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></symbol><symbol id="power" viewBox="0 0 24 24"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></symbol><symbol id="wallet" viewBox="0 0 24 24"><path d="M20 7H4V4h14v3M4 7v14h17V7zM21 11h-6v6h6M17 14h.01"/></symbol><symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3 6 7 1-5 5 1 8-6-4-6 4 1-8-5-5 7-1z"/></symbol><symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7 12l3 3 7-7"/></symbol><symbol id="grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></symbol></defs <header><div><h1>RoadAssist / Soft UI</h1><p>Driver & provider dashboard concept · Original brand, typography and road pattern<br>Neumorphic surfaces, recessed controls and tactile button feedback.</p></div><button class="mode" onclick="document.body.classList.toggle('dark')">Light / dark</button></header><div class="board"></div><p class="footnote">Preview only · Sample names, availability, fees and earnings · No account or app changes</p>
<script>
const asset='../../../assets/images/';const icon=n=>`<svg class="i" aria-hidden="true"><use href="#${n}"/></svg>`;
function road(){let paths='';for(let i=0;i<9;i++){const a=390*(.12+i*.15);paths+=`<path d="M${a} 0 C${a+110} 110 ${a-150} 169 ${a-40} 304 C${a+100} 438 ${a-90} 633 ${a+50} 844"/>`}return `<svg class="road" viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true"><g stroke="#55a7cd" stroke-opacity=".14" fill="none">${paths}</g><path d="M304 0C452 101 187 135 351 236" stroke="#20b8ed" stroke-opacity=".06" stroke-width="28" fill="none"/><path d="M304 0C452 101 187 135 351 236" stroke="#20b8ed" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="8 11" fill="none"/></svg>`}
const brandHeader=()=>`<div class="top"><img class="logo" src="${asset}roadassist_mark.png" alt="RoadAssist"><span class="wordmark">Road<b>Assist</b></span><button class="round" aria-label="Notifications" onclick="notice(this,'Sample notifications preview.')">${icon('bell')}</button></div>`;
const nav=provider=>`<nav class="nav" aria-label="${provider?'Provider':'Driver'} navigation">${(provider?[['grid','Dashboard'],['list','Requests'],['car','Jobs'],['chat','Messages'],['user','Profile']]:[['home','Home'],['list','Requests'],['chat','Messages'],['user','Profile']]).map(([i,t],n)=>`<button class="${n===0?'active':''}" onclick="notice(this,'${t} · design preview only')">${icon(i)}${t}</button>`).join('')}</nav>`;
const driver=`<div class="content">${brandHeader()}<p class="greeting">Good morning, Affan</p><h2>Every journey.<br>A little more assured.</h2><div class="location">${icon('pin')}Colombo, Sri Lanka</div><section class="help soft"><div class="orb"></div><span class="smallcap">ROADSIDE ASSISTANCE</span><h3>A helping hand,<br>when you need it.</h3><p>Find a suitable provider and review your visit fee before requesting help.</p><button class="primary" onclick="notice(this,'Request assistance · preview only. No request sent.')">Request assistance ${icon('arrow')}</button></section><div class="section-title"><h3>Your vehicle</h3><span>Default vehicle</span></div><section class="vehicle soft"><div><span class="smallcap">READY FOR YOUR NEXT TRIP</span><h4>Toyota Aqua</h4><p>CAB–3223 · Hybrid</p></div><img class="car" src="${asset}auth_journey_car.png" alt="Illustrative silver car"><span>${icon('arrow')}</span></section><div class="section-title"><h3>What do you need?</h3><span>Explore services</span></div><div class="services">${[['tool','Mechanic'],['tyre','Flat tyre'],['battery','Jumpstart']].map(([i,t])=>`<button class="service" onclick="notice(this,'${t} selected · sample interaction')"><span class="service-icon">${icon(i)}</span>${t}</button>`).join('')}</div><div class="section-title"><h3>Last assistance</h3><span>Your history</span></div><div class="recent soft"><span class="icon-well inset">${icon('check')}</span><div><strong>General mechanic</strong><p>Completed · 22 Oct</p></div><span>View receipt</span></div></div>${nav(false)}`;
const provider=`<div class="content">${brandHeader()}<p class="greeting">Good morning, Munshif</p><h2>Your skills.<br>Someone's way home.</h2><div class="location">${icon('pin')}20 km service coverage</div><section class="availability soft"><span class="icon-well inset">${icon('power')}</span><div><strong id="availability-title">Accepting requests</strong><p id="availability-copy">You're visible to nearby drivers</p></div><button class="switch inset" role="switch" aria-checked="true" aria-label="Sample availability" onclick="availability(this)"></button></section><div class="metrics"><section class="metric soft">${icon('wallet')}<span class="smallcap" style="display:block;margin-bottom:7px">THIS WEEK</span><strong><small>LKR</small> 12,400</strong><p>Completed service revenue</p></section><section class="metric soft">${icon('star')}<span class="smallcap" style="display:block;margin-bottom:7px">YOUR RATING</span><strong class="rating">4.9 ${icon('star')}</strong><p>From 28 driver reviews</p></section></div><div class="section-title"><h3>Nearby requests</h3><span id="request-count">1 suitable request</span></div><section class="job soft" id="sample-job"><div class="job-head"><span class="avatar inset">NP</span><div><strong>Nimal Perera</strong><p>Toyota Aqua · CAB–1234</p></div><span class="tag">Normal</span></div><h4>Flat tyre assistance</h4><p class="meta">Galle Road · 2.4 km away</p><div class="fee inset"><span>Estimated visit fee</span><strong>LKR 140</strong></div><button class="primary" onclick="notice(this,'Request details · preview only. No job accepted.')">View request ${icon('arrow')}</button></section><div class="provider-footer">${icon('check')}Verified provider · Ready to help</div></div>${nav(true)}`;
document.querySelector('.board').innerHTML=[['DRIVER DASHBOARD',driver],['PROVIDER DASHBOARD',provider]].map(([label,body])=>`<div><p class="label">${label}</p><article class="phone">${road()}${body}<div class="toast" role="status"></div></article></div>`).join('');
function notice(button,text){const t=button.closest('.phone').querySelector('.toast');t.textContent=text;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function availability(b){const online=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',online);document.querySelector('#availability-title').textContent=online?'Accepting requests':'Availability paused';document.querySelector('#availability-copy').textContent=online?"You're visible to nearby drivers":'Sample availability is switched off';document.querySelector('#sample-job').style.opacity=online?'1':'.4';document.querySelector('#request-count').textContent=online?'1 suitable request':'Paused · preview only'}
</script></html>
